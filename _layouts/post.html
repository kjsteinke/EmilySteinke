<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.excerpt | strip_html | escape }}">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
  </head>
  <body>
    <header class="masthead">
      <a class="wordmark" href="{{ '/' | relative_url }}">ES <span>Family archive</span></a>
      <nav aria-label="Main navigation"><a href="{{ '/' | relative_url }}#archive">All posts</a></nav>
    </header>
    <main class="single-post">
      <a class="back-link" href="{{ '/' | relative_url }}#archive">&larr; Back to the archive</a>
      <header class="single-post-header">
        <p class="entry-kind">{{ page.category }} · {{ page.record_date }}</p>
        <h1>{{ page.title }}</h1>
        <p class="post-meta">Added to the archive {{ page.date | date: "%B %-d, %Y" }}</p>
      </header>
      <article class="single-post-content">
        <img src="{{ page.image | relative_url }}" alt="{{ page.image_alt }}">
        {{ content }}
      </article>
    </main>
    <footer>
      <span>Emily Steinke (Sigurdson)</span>
      <span>Kept with love, shared with family.</span>
    </footer>
  </body>
</html>
